# pve-console-log: the PVE GUI console is xterm.js, not a Linux VT or a VT220.
# With TERM=linux/vt220 there is no alternate screen, so nano/vim/less/htop draw
# over the shell history and leave scroll regions behind, and F-keys/Home/End
# arrive as sequences those terminfo entries do not know.
# Install as a drop-in for the console getty:
#   CT: /etc/systemd/system/console-getty.service.d/xterm.conf
#   VM: /etc/systemd/system/serial-getty@ttyS0.service.d/xterm.conf
[Service]
Environment=TERM=xterm-256color
