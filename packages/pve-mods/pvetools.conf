# How pve-tools builds this package (read by scripts/pkg-version.sh and scripts/build-downstream.sh).
# The source is the `pvetools` branch of the fork Msprg/PVE-mods (submodule ./source), which tracks
# upstream Meliox/PVE-mods releases plus any local changes. The package is built with upstream's own
# debian/ (debhelper) and gets the version <upstream changelog version>+pvetools<REVISION>.
SOURCE=source
UPSTREAM=Meliox/PVE-mods
FORK=Msprg/PVE-mods
# bump for every pve-tools release of the same upstream version; back to 1 when upstream moves on
REVISION=1
MAINTAINER=Msprg <18015488+Msprg@users.noreply.github.com>
